[package]
name = "gitline-core"
description = "Gitline's git layer and diff/graph logic, shared by the native front ends"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
tempfile = "3"
