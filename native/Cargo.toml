[workspace]
resolver = "3"
members = ["gitline-core", "gitline-iced"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gitline-core = { path = "gitline-core" }

[profile.dev.package."*"]
# Dependencies (the toolkits, syntect) are slow unoptimised; our own code stays quick to rebuild.
opt-level = 2
